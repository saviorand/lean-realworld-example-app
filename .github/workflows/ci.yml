name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: host=localhost user=realworld password=realworld dbname=realworld
    steps:
      - uses: actions/checkout@v5

      - name: Install libpq and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev pkg-config

      # Builds, runs the unit tests (`lake test`), and fails if any declaration depends on an axiom
      # beyond Lean's standard three, so a `sorry` cannot hide in a proof.
      - uses: leanprover/lean-action@v1
        with:
          axiom-audit: true

      - name: Run the RealWorld API suite
        run: |
          git clone --depth 1 https://github.com/realworld-apps/realworld ../realworld
          curl -sSL -o /tmp/hurl.tar.gz https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/hurl.tar.gz -C /tmp
          HURL=/tmp/hurl-8.0.1-x86_64-unknown-linux-gnu/bin/hurl scripts/run-api-tests.sh
